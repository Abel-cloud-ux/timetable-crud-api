<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Timetable & Goals</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    h1 { color: #0057b8; }
    form { background: #f3f6fa; padding: 1rem; border-radius: 6px; display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; background: #0057b8; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.delete { background: #b00020; }
    button.cancel { background: #666; }
    .actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; }
    #message { margin: 1rem 0; font-weight: bold; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #0057b8; padding: 0.5rem; text-align: left; }
    th { background: #0057b8; color: white; }
  </style>
</head>
<body>
  <h1>Student Timetable &amp; Goals</h1>

  <form id="timetable-form">
    <input type="hidden" id="record-id">

    <div><label for="course_code">Course Code *</label>
      <input type="text" id="course_code" required></div>
    <div><label for="course_name">Course Name</label>
      <input type="text" id="course_name"></div>
    <div><label for="lecturer">Lecturer</label>
      <input type="text" id="lecturer"></div>
    <div><label for="day_of_week">Day</label>
      <input type="text" id="day_of_week" placeholder="e.g. Monday"></div>
    <div><label for="start_time">Start Time</label>
      <input type="text" id="start_time" placeholder="08:00"></div>
    <div><label for="end_time">End Time</label>
      <input type="text" id="end_time" placeholder="10:00"></div>
    <div><label for="venue">Venue</label>
      <input type="text" id="venue"></div>
    <div><label for="goal">Goal</label>
      <input type="text" id="goal"></div>

    <div class="actions">
      <button type="submit" id="save-btn">Add Record</button>
      <button type="button" class="cancel" id="cancel-btn" hidden>Cancel Edit</button>
    </div>
  </form>

  <p id="message" role="status"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Course Code</th><th>Course Name</th><th>Lecturer</th>
          <th>Day</th><th>Start</th><th>End</th><th>Venue</th><th>Goal</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
